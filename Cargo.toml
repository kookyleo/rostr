[package]
name = "rostr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AI Model Resource Registry — discover, evaluate, and select AI models"
license = "Apache-2.0"
repository = "https://github.com/kookyleo/rostr"
readme = "README.md"
keywords = ["ai", "models", "registry", "cli", "agents"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
clap = "4.5"
ratatui = "0.29.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
tempfile = "3.27.0"
toml = "1.1.8"
