[package]
name = "rostr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AI Model Resource Registry — local models, quota observations and public benchmark scores"
license = "Apache-2.0"
repository = "https://github.com/kookyleo/rostr"
readme = "README.md"
keywords = ["ai", "models", "registry", "cli", "agents"]
categories = ["command-line-utilities"]
include = ["src/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
anyhow = "1.0.104"
clap = "4.5"
ratatui = "0.29.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
tempfile = "3.27.0"
toml = "1.1.8"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
csv = "1.4.0"
